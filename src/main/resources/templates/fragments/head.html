<!-- src/main/resources/templates/fragments/head.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:insert="${pageTitle}">관리자 페이지</title>

    <!-- Bootstrap(필요시) 혹은 커스텀 CSS 불러오기 -->
    <link
            th:href="@{/css/bootstrap.min.css}"
            rel="stylesheet"
            integrity="sha384-..."
            crossorigin="anonymous"
    />
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>
<body>
<!-- 상단 네비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Portal</a>
    <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
    >
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
            <!-- 로그인 상태라면 대시보드, 로그아웃 링크 노출 -->
            <li class="nav-item" th:if="${#request.remoteUser != null}">
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
