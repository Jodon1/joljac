# ================== ??? ?? ==================
spring.application.name=dorm-matching

# ================== DB ?? ==================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/dorm_matching?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234


# ================== JPA / Hibernate ==================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ================== ?? ?? ==================
server.port=8080
server.address=0.0.0.0

# ================== Spring Security (????) ==================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ================== Swagger ?? (??) ==================
springdoc.swagger-ui.urls[0].name=Dorm?Matching API
springdoc.swagger-ui.urls[0].url=/openapi/dorm_matching_api.yaml
